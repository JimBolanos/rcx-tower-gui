<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escuadrón Estelar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: una sola pantalla de cabina — HUD arriba, radar (canvas) al centro, mandos abajo. */
:root{
  --void:#07060f; --panel:#14122a; --line:#2c2852; --ink:#e9e6ff; --dim:#8f89c4;
  --laser:#ff3b3b; --gold:#ffc83d; --hull:#efefd8;
  --pix:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--ink);font-family:var(--pix);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box}
.hud{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;align-items:end;gap:8px;font-size:10px;line-height:1.6}
.hud b{display:block;color:var(--dim);font-weight:400;font-size:8px;letter-spacing:.08em}
.hud span{font-variant-numeric:tabular-nums;color:var(--gold)}
#lives{color:var(--laser)}
.stage{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:2/3;height:100%;image-rendering:pixelated;
  border:2px solid var(--line);background:#000;box-sizing:border-box}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  text-align:center;padding:16px;background:rgba(7,6,15,.72)}
.overlay h1{margin:0;font-size:clamp(16px,5vw,24px);line-height:1.5;color:var(--gold);text-shadow:3px 3px 0 #7a2a00;text-wrap:balance}
.overlay p{margin:0;font-size:9px;line-height:1.9;color:var(--dim);max-width:30ch}
.levels{display:flex;flex-direction:column;gap:10px;width:min(260px,100%)}
.btn{font-family:var(--pix);font-size:11px;color:var(--ink);background:var(--panel);border:2px solid var(--line);
  padding:12px 10px;cursor:pointer;box-shadow:0 4px 0 var(--line);text-align:left;display:flex;justify-content:space-between;gap:8px}
.btn small{color:var(--dim);font-size:8px;align-self:center}
.btn:hover,.btn:focus-visible{border-color:var(--gold);outline:none;color:var(--gold)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.controls{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;padding-bottom:4px}
.ctl{font-family:var(--pix);font-size:18px;height:64px;color:var(--ink);background:var(--panel);border:2px solid var(--line);
  box-shadow:0 5px 0 var(--line);cursor:pointer;touch-action:none}
.ctl.on{transform:translateY(4px);box-shadow:0 1px 0 var(--line);border-color:var(--gold)}
#fire{background:#3a0b10;border-color:var(--laser);color:#ffd2d2;font-size:12px;box-shadow:0 5px 0 #6b1018}
#fire.on{box-shadow:0 1px 0 #6b1018}
.hint{font-size:7px;color:var(--dim);text-align:center;line-height:1.8}
#pause{font-family:var(--pix);font-size:9px;background:none;border:2px solid var(--line);color:var(--dim);padding:6px;cursor:pointer}
@media (hover:none){.hint{display:none}}
@media (prefers-reduced-motion:reduce){.btn:active,.ctl.on{transform:none}}
</style>
</head><body>
<div class="app">
  <div class="hud">
    <div><b>PUNTOS</b><span id="score">000000</span></div>
    <div><b>RECORD</b><span id="best">000000</span></div>
    <div><b>VIDAS</b><span id="lives">♥♥♥</span></div>
    <button id="pause" type="button" aria-label="Pausa">II</button>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="720"></canvas>
    <div class="overlay" id="menu">
      <h1>ESCUADRON<br>ESTELAR</h1>
      <p>Derriba cazas enemigos (+100) y revienta asteroides (+50 por tamaño). Elige tu nivel:</p>
      <div class="levels">
        <button class="btn" id="lv1" type="button" data-lv="1">1 · CADETE <small>5 vidas</small></button>
        <button class="btn" id="lv2" type="button" data-lv="2">2 · PILOTO <small>disparan</small></button>
        <button class="btn" id="lv3" type="button" data-lv="3">3 · AS <small>picados</small></button>
      </div>
    </div>
    <div class="overlay" id="over" hidden>
      <h1 id="overTitle">DERRIBADO</h1>
      <p id="overText"></p>
      <div class="levels">
        <button class="btn" id="again" type="button">REINTENTAR <small>mismo nivel</small></button>
        <button class="btn" id="tomenu" type="button">MENU <small>cambiar nivel</small></button>
      </div>
    </div>
    <div class="overlay" id="paused" hidden><h1>PAUSA</h1><p>Toca II o pulsa P para seguir</p></div>
  </div>
  <div class="controls">
    <button class="ctl" id="left" type="button" aria-label="Izquierda">◀</button>
    <button class="ctl" id="right" type="button" aria-label="Derecha">▶</button>
    <button class="ctl" id="fire" type="button">FUEGO</button>
  </div>
  <div class="hint">TECLADO: FLECHAS o A/D para moverte · ESPACIO dispara · P pausa</div>
</div>

const W=480,H=720;
const cv=document.getElementById('cv'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);

const LEVELS={
  1:{name:'CADETE',lives:5,spawn:1.5,eSpeed:85, weave:0, shoot:0,   bSpeed:0,  ast:3.2,aSpeed:70, dive:0},
  2:{name:'PILOTO',lives:3,spawn:1.05,eSpeed:120,weave:45,shoot:.35,bSpeed:240,ast:2.4,aSpeed:110,dive:0},
  3:{name:'AS',    lives:3,spawn:.7, eSpeed:160,weave:75,shoot:.8, bSpeed:320,ast:1.7,aSpeed:150,dive:.35}
};

/* ---------- sprites ---------- */
const ship=new Image();ship.src=SHIP_SRC;
function sprite(rows,pal,s){const c=document.createElement('canvas');c.width=rows[0].length*s;c.height=rows.length*s;
  const g=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x*s,y*s,s,s)}}));return c}
// Caza enemigo original "Raptor": alas en flecha y núcleo violeta.
const RAPTOR=[
 "k.....kkk.....k",
 "kk...kcccK...kk",
 "kbk.kcdddck.kbk",
 "kbbkkcdedckkbbk",
 "kbbbkcdedckbbbk",
 "kbbbbkcdckbbbbk",
 ".kbbbkkckkbbbk.",
 "..kbk.kkk.kbk..",
 "...k..r.r..k...",
 "......r.r......"];
const enemyImg=sprite(RAPTOR,{k:'#1c1a33',K:'#1c1a33',b:'#4b4f7a',c:'#7a4fd0',d:'#c070ff',e:'#ffe6ff',r:'#ff5a3b'},4);
const enemyHit=sprite(RAPTOR,{k:'#fff',K:'#fff',b:'#fff',c:'#fff',d:'#fff',e:'#fff',r:'#fff'},4);

function rockImg(n){ // asteroide de bloques
  const s=4,c=document.createElement('canvas');c.width=c.height=n*s;const g=c.getContext('2d');
  const r=n/2-.5, cols=['#5a4a3e','#7a6553','#9b836c','#3d3129'];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const dx=x-r,dy=y-r,d=Math.hypot(dx,dy)+Math.sin(Math.atan2(dy,dx)*3+n)*1.1;
    if(d<r){let i=d>r-1.2?3:(dx+dy<-r*.6?2:1);if(Math.random()<.12)i=0;g.fillStyle=cols[i];g.fillRect(x*s,y*s,s,s)}}
  return c}

/* ---------- audio ---------- */
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function beep(f1,f2,dur,type,vol){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}
function boom(big){if(!ac)return;const len=ac.sampleRate*(big?.6:.3),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=ac.createBufferSource(),g=ac.createGain();
  g.gain.value=big?.5:.3;s.buffer=b;s.connect(g).connect(ac.destination);s.start()}

/* ---------- estado ---------- */
let st=null,state='menu',level=1,last=0,shake=0;
const keys={left:false,right:false,fire:false};
const stars=[...Array(90)].map(()=>({x:Math.random()*W,y:Math.random()*H,z:1+Math.floor(Math.random()*3)}));
function best(){try{return +localStorage.getItem('ee-best-'+level)||0}catch(e){return 0}}
function saveBest(v){try{localStorage.setItem('ee-best-'+level,v)}catch(e){}}

function start(lv){level=lv;const L=LEVELS[lv];audio();
  st={L,t:0,score:0,lives:L.lives,px:W/2,py:H-70,cool:0,inv:1.5,eT:1,aT:2,
      shots:[],eshots:[],enemies:[],rocks:[],parts:[],pops:[],kills:0};
  state='play';$('menu').hidden=$('over').hidden=$('paused').hidden=true;hud()}
function hud(){const p=n=>String(n).padStart(6,'0');$('score').textContent=p(st?st.score:0);
  $('best').textContent=p(Math.max(best(),st?st.score:0));$('lives').textContent=st?'♥'.repeat(Math.max(0,st.lives)):'—'}

function explode(x,y,n,cols){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=40+Math.random()*220;
  st.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.4+Math.random()*.6,c:cols[i%cols.length],s:Math.random()<.3?6:4})}}
function pop(x,y,txt){st.pops.push({x,y,txt,l:.9})}

function update(dt){
  const s=st,L=s.L;s.t+=dt;const ramp=1+Math.min(s.t/90,1)*.6;
  // jugador
  const dir=(keys.right?1:0)-(keys.left?1:0);s.px=Math.max(40,Math.min(W-40,s.px+dir*330*dt));
  s.cool-=dt;s.inv-=dt;
  if(keys.fire&&s.cool<=0){s.cool=.2;s.shots.push({x:s.px-37,y:s.py-6},{x:s.px+37,y:s.py-6});beep(1400,180,.12,'square',.05)}
  // aparición
  s.eT-=dt;if(s.eT<=0){s.eT=L.spawn/ramp*(.6+Math.random()*.8);
    s.enemies.push({x:40+Math.random()*(W-80),y:-40,ph:Math.random()*6.28,hp:level===3&&Math.random()<.3?2:1,
      cool:1+Math.random()*2,flash:0,dive:Math.random()<L.dive,baseX:0});s.enemies.at(-1).baseX=s.enemies.at(-1).x}
  s.aT-=dt;if(s.aT<=0){s.aT=L.ast*(.5+Math.random());const n=[6,9,12][Math.floor(Math.random()*3)];
    s.rocks.push({x:30+Math.random()*(W-60),y:-n*4,vx:(Math.random()-.5)*50,vy:L.aSpeed*(.7+Math.random()*.6),
      n,r:n*2-2,hp:n/3,max:n/3,rot:0,vr:(Math.random()-.5)*2,img:rockImg(n),flash:0})}
  // disparos
  s.shots.forEach(b=>b.y-=620*dt);s.shots=s.shots.filter(b=>b.y>-20);
  s.eshots.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});s.eshots=s.eshots.filter(b=>b.y<H+20&&b.x>-20&&b.x<W+20);
  // enemigos
  for(const e of s.enemies){e.flash-=dt;
    if(e.dive&&e.y>H*.3){const dx=s.px-e.x;e.x+=Math.sign(dx)*Math.min(Math.abs(dx),140*dt);e.y+=L.eSpeed*1.6*ramp*dt}
    else{e.y+=L.eSpeed*ramp*dt;e.ph+=dt*2.2;e.x=Math.max(30,Math.min(W-30,e.baseX+Math.sin(e.ph)*L.weave))}
    if(L.shoot){e.cool-=dt;if(e.cool<=0&&e.y>0&&e.y<H*.7){e.cool=(1.6+Math.random()*2)/L.shoot;
      const a=Math.atan2(s.py-e.y,s.px-e.x),aim=level===3?a:Math.PI/2;
      s.eshots.push({x:e.x,y:e.y+20,vx:Math.cos(aim)*L.bSpeed,vy:Math.sin(aim)*L.bSpeed});beep(500,120,.1,'sawtooth',.03)}}}
  for(const r of s.rocks){r.x+=r.vx*dt;r.y+=r.vy*dt;r.rot+=r.vr*dt;r.flash-=dt;if(r.x<r.r||r.x>W-r.r)r.vx*=-1}
  // impactos de láser
  for(const b of s.shots){
    for(const e of s.enemies)if(!b.dead&&e.hp>0&&Math.abs(b.x-e.x)<28&&Math.abs(b.y-e.y)<22){b.dead=1;e.hp--;e.flash=.08;
      if(e.hp<=0){s.score+=100;s.kills++;pop(e.x,e.y,'+100');explode(e.x,e.y,22,['#fff','#ffc83d','#ff7a2a','#c070ff']);boom(false);shake=.15}}
    for(const r of s.rocks)if(!b.dead&&r.hp>0&&Math.hypot(b.x-r.x,b.y-r.y)<r.r+3){b.dead=1;r.hp--;r.flash=.08;
      if(r.hp<=0){const p=Math.round(r.max)*50;s.score+=p;pop(r.x,r.y,'+'+p);explode(r.x,r.y,14+r.n,['#9b836c','#5a4a3e','#ffc83d']);boom(r.n>9);shake=.12}}}
  s.shots=s.shots.filter(b=>!b.dead);
  // choques con el jugador
  const hitP=(x,y,rx,ry)=>Math.abs(x-s.px)<rx&&Math.abs(y-(s.py+4))<ry;
  if(s.inv<=0){
    for(const b of s.eshots)if(hitP(b.x,b.y,16,28)){b.dead=1;hurt();break}
    for(const e of s.enemies)if(e.hp>0&&hitP(e.x,e.y,40,40)){e.hp=0;explode(e.x,e.y,22,['#fff','#ff7a2a']);hurt();break}
    for(const r of s.rocks)if(r.hp>0&&hitP(r.x,r.y,r.r+14,r.r+24)){r.hp=0;explode(r.x,r.y,18,['#9b836c','#5a4a3e']);hurt();break}}
  s.eshots=s.eshots.filter(b=>!b.dead);
  s.enemies=s.enemies.filter(e=>e.hp>0&&e.y<H+50);s.rocks=s.rocks.filter(r=>r.hp>0&&r.y<H+60);
  s.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt});s.parts=s.parts.filter(p=>p.l>0);
  s.pops.forEach(p=>{p.y-=40*dt;p.l-=dt});s.pops=s.pops.filter(p=>p.l>0);
  shake=Math.max(0,shake-dt);hud()}

function hurt(){const s=st;s.lives--;s.inv=2;shake=.35;explode(s.px,s.py,30,['#fff','#ff3b3b','#ffc83d']);boom(true);
  if(s.lives<=0){state='over';const b=best();if(s.score>b)saveBest(s.score);
    $('overTitle').textContent=s.score>b&&s.score>0?'NUEVO RECORD!':'DERRIBADO';
    $('overText').textContent=`Nivel ${s.L.name} · ${s.score} puntos · ${s.kills} cazas derribados`;
    $('over').hidden=false;hud()}}

function draw(dt){
  cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#05040c';cx.fillRect(0,0,W,H);
  const sp=state==='play'?1:.35;
  for(const s of stars){s.y+=s.z*s.z*18*dt*sp;if(s.y>H){s.y=0;s.x=Math.random()*W}
    cx.fillStyle=['','#3d3a66','#8f89c4','#ffffff'][s.z];cx.fillRect(Math.round(s.x),Math.round(s.y),s.z>2?3:2,s.z>2?3:2)}
  if(!st)return;const s=st;
  if(shake>0){cx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30)}
  for(const r of s.rocks){cx.save();cx.translate(Math.round(r.x),Math.round(r.y));cx.rotate(Math.round(r.rot*4)/4);
    cx.drawImage(r.img,-r.img.width/2,-r.img.height/2);if(r.flash>0){cx.globalCompositeOperation='lighter';cx.globalAlpha=.6;cx.drawImage(r.img,-r.img.width/2,-r.img.height/2)}cx.restore()}
  for(const e of s.enemies){const im=e.flash>0?enemyHit:enemyImg;cx.drawImage(im,Math.round(e.x-im.width/2),Math.round(e.y-im.height/2));
    if(e.hp>1){cx.fillStyle='#ffc83d';cx.fillRect(Math.round(e.x)-2,Math.round(e.y)-26,4,4)}}
  cx.fillStyle='#ff3b3b';for(const b of s.shots){cx.fillRect(Math.round(b.x)-2,Math.round(b.y)-14,4,18)}
  cx.fillStyle='#ffd2d2';for(const b of s.shots){cx.fillRect(Math.round(b.x)-1,Math.round(b.y)-12,2,14)}
  for(const b of s.eshots){cx.fillStyle='#4dff7a';cx.fillRect(Math.round(b.x)-3,Math.round(b.y)-3,6,6);cx.fillStyle='#e6ffe9';cx.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,2,2)}
  if(state!=='over'&&(s.inv<=0||Math.floor(s.inv*12)%2===0)){
    if(ship.complete){cx.drawImage(ship,Math.round(s.px-ship.width/2),Math.round(s.py-ship.height/2))}
    if(state==='play'&&Math.random()<.8){cx.fillStyle=Math.random()<.5?'#ff9a2a':'#ffe08a';
      cx.fillRect(Math.round(s.px)-11,s.py+37,4,4+Math.random()*6);cx.fillRect(Math.round(s.px)+11,s.py+37,4,4+Math.random()*6)}}
  for(const p of s.parts){cx.globalAlpha=Math.min(1,p.l*2);cx.fillStyle=p.c;cx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}cx.globalAlpha=1;
  cx.font='12px "Press Start 2P", monospace';cx.textAlign='center';
  for(const p of s.pops){cx.globalAlpha=Math.min(1,p.l*2);cx.fillStyle='#ffc83d';cx.fillText(p.txt,p.x,p.y)}cx.globalAlpha=1;
  cx.setTransform(1,0,0,1,0,0);cx.textAlign='left';cx.font='10px "Press Start 2P", monospace';cx.fillStyle='#8f89c4';
  cx.fillText('NIVEL '+s.L.name,10,20)}

function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(state==='play')update(dt);draw(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- controles ---------- */
document.querySelectorAll('[data-lv]').forEach(b=>b.addEventListener('click',()=>start(+b.dataset.lv)));
$('again').onclick=()=>start(level);
$('tomenu').onclick=()=>{state='menu';st=null;$('over').hidden=true;$('menu').hidden=false;hud()};
function togglePause(){if(state==='play'){state='pause';$('paused').hidden=false}else if(state==='pause'){state='play';$('paused').hidden=true}}
$('pause').onclick=togglePause;$('paused').onclick=togglePause;
function hold(id,k){const el=$(id);
  const on=e=>{e.preventDefault();audio();keys[k]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{keys[k]=false;el.classList.remove('on')};
  el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));
  el.addEventListener('contextmenu',e=>e.preventDefault())}
hold('left','left');hold('right','right');hold('fire','fire');
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'fire'};
addEventListener('keydown',e=>{if(KM[e.code]){if(state==='play'||e.code!=='Space')e.preventDefault();keys[KM[e.code]]=true;audio()}
  if(e.code==='KeyP'||e.code==='Escape')togglePause()});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false});
addEventListener('blur',()=>{keys.left=keys.right=keys.fire=false;if(state==='play')togglePause()});
hud();
})();
</script>
</body></html>
