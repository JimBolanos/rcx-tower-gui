[package]
name = "print3rbot-convertidor"
version = "0.1.0"
edition = "2021"
description = "Convierte una imagen sencilla en trazos (dibujo.py) para el plotter EV3 Print3rbot con Pybricks"
license = "MIT"

[[bin]]
name = "print3rbot-convertidor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
rfd = "0.15.1"

[profile.release]
opt-level = 3
lto = true
strip = true
